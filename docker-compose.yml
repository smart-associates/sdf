services:
  sdf:
    image: smartassociates/sdf:${SDF_IMAGE_TAG:-latest}
    # `build:` is kept so developers can `docker compose up --build` from source.
    # End users without the source tree can just `docker compose pull && docker compose up`.
    # Defaults to no_cache=true for clean rebuilds; set SDF_NO_CACHE=false to reuse layer cache.
    build:
      context: .
      no_cache: ${SDF_NO_CACHE:-true}
    pull_policy: missing
    # Host networking lets the container reach PostgreSQL on the host's 127.0.0.1
    # without requiring listen_addresses or pg_hba changes for the docker bridge.
    # The app binds 0.0.0.0:8000 directly on the host, so port publishing is not needed.
    # On Linux this works out of the box; on Docker Desktop (macOS/Windows) it
    # requires enabling "Host networking" in Settings → Resources → Network.
    network_mode: host
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-127.0.0.1}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-sdf}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-char-key-for-prod!!}
      # Set DATABASE_URL explicitly to bypass Postgres auto-detection.
      DATABASE_URL: ${DATABASE_URL:-}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-}
