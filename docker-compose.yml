services:
  sdf:
    image: smartassociates/sdf:${SDF_IMAGE_TAG:-latest}
    # `build:` is kept so developers can `docker compose up --build` from source.
    # End users without the source tree can just `docker compose pull && docker compose up`.
    build: .
    pull_policy: missing
    ports:
      - "8000:8000"
    extra_hosts:
      # Lets the container reach the host's localhost on Linux.
      # Mac/Windows Docker Desktop already resolves host.docker.internal.
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-sdf}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-char-key-for-prod!!}
      # Set DATABASE_URL explicitly to bypass Postgres auto-detection.
      DATABASE_URL: ${DATABASE_URL:-}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-}
