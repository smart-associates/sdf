services:
  sdf:
    image: ghcr.io/smart-associates/sdf:${SDF_IMAGE_TAG:-latest}
    # `build:` is kept so developers can `docker compose up --build` from source.
    # End users without the source tree can just `docker compose pull && docker compose up`.
    build: .
    pull_policy: missing
    # Host networking lets the container reach PostgreSQL on the host's 127.0.0.1
    # without requiring listen_addresses or pg_hba changes for the docker bridge.
    # The app binds 0.0.0.0:8000 directly on the host, so port publishing is not needed.
    # On Linux this works out of the box; on Docker Desktop (macOS/Windows) it
    # requires enabling "Host networking" in Settings → Resources → Network.
    network_mode: host
    restart: unless-stopped
    # To use a `filesystem` connection against an on-prem/NFS location (e.g.
    # for local staging ahead of a cloud upload — see the "Local Staging
    # Connection" option on a job's Bulk Staging settings), mount the export
    # in and point the connection's directory at the mounted path. Docker
    # doesn't need to know the underlying mount is NFS; the host just needs
    # it mounted first (e.g. via /etc/fstab or autofs):
    # volumes:
    #   - /mnt/nfs/warehouse:/data/warehouse
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-127.0.0.1}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-sdf}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-char-key-for-prod!!}
      # Set DATABASE_URL explicitly to bypass Postgres auto-detection.
      DATABASE_URL: ${DATABASE_URL:-}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-}
