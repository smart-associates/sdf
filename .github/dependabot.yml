# Dependabot (smart-associates-infra #148, decided 2026-10-24).
# Security updates: Dependabot opens a PR as soon as an advisory is published
# (repo setting "Dependabot security updates", on since 2026-10-24).
# Version updates below: weekly, Friday 22:00 UK time (the low-severity window),
# minor + patch grouped into one PR per ecosystem; a major update gets one PR per dependency.
# No custom labels: Dependabot adds its own (dependencies + the ecosystem).
# Merge gate: .github/workflows/dependabot-auto-merge.yml (only where CI exists).
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "22:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
      docker-major:
        update-types: ["major"]
        group-by: dependency-name
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "22:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      docker_compose-minor-patch:
        update-types: ["minor", "patch"]
      docker_compose-major:
        update-types: ["major"]
        group-by: dependency-name
  - package-ecosystem: "npm"
    directories:
      - "/ui"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "22:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
        group-by: dependency-name
  - package-ecosystem: "pip"
    directories:
      - "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "22:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
      pip-major:
        update-types: ["major"]
        group-by: dependency-name
