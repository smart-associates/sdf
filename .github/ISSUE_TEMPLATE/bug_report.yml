name: Bug report
description: Report a reproducible problem with SDF
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDF version / commit
    validations:
      required: true
  - type: dropdown
    id: db-types
    attributes:
      label: Database types involved
      multiple: true
      options:
        - PostgreSQL
        - MySQL
        - Filesystem (CSV/Parquet/Avro)
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
